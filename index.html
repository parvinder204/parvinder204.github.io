<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#252422" />
    <meta name="description" content="Parvinder Singh — Full Stack Developer specializing in Python, Django, React, AI automation and cloud-native systems." />
    <meta name="keywords" content="Parvinder Singh, Full Stack Developer, Python, Django, React, Vue, FastAPI, AWS, AI, Neural Networks, Data Science, Portfolio, Blog" />
    <meta property="og:title" content="Parvinder Singh — Full Stack Developer" />
    <meta property="og:description" content="Building scalable microservices, SaaS apps, and AI-powered systems." />
    <meta property="og:type" content="website" />
    <title>Parvinder Singh — Full Stack Developer</title>
    <!-- Apply saved / system theme before first paint (prevents a flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
